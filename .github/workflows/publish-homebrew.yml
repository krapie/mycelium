name: Publish to Homebrew

# Fires on the same event as publish.yml (release: published) but as a
# fully separate workflow run, not a second job in that file — so a broken
# tap bump shows up as its own red run in the Actions tab instead of being
# masked by (or blocking) npm publish's own status. Since this is a
# separate workflow, there's no job-level `needs:` to enforce it runs after
# npm publish actually finishes — the first step polls the npm registry for
# the tarball instead, since GitHub gives no ordering guarantee between two
# workflows triggered by the same event.
#
# Bumps the formula in krapie/homebrew-tap (a separate repo) via
# `brew bump-formula-pr`, which opens a PR there rather than pushing
# directly. Requires a HOMEBREW_TAP_TOKEN repo secret — a fine-grained
# GitHub PAT scoped to just krapie/homebrew-tap with contents +
# pull-requests write.
#
# Also runnable manually (workflow_dispatch) with a tag input -- a
# `release: published` event only fires once per release, so if this
# workflow's own code was broken at that moment (as it was for v0.2.0,
# v2.5.1, v0.3.0, and initially v0.3.2), re-running the original failed
# Actions run replays the workflow file as it existed at that ref, not
# the fixed one on main. Manual dispatch runs the current main version
# against any already-published tag instead.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump the formula to (e.g. v0.3.2)"
        required: true
        type: string

jobs:
  update-homebrew-tap:
    runs-on: macos-latest # Homebrew is preinstalled here; ubuntu-latest is not
    permissions:
      contents: read
    steps:
      - name: Wait for the npm tarball to be published
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}" # release tags are "v0.1.5"; the npm tarball path has no leading v
          URL="https://registry.npmjs.org/@kevinprk/mycelium/-/mycelium-${VERSION}.tgz"
          # 20 x 15s (5 min) used to be the bound here, but it failed this
          # exact way on 3 of 3 real releases (v0.2.0, v2.5.1, v0.3.0) --
          # the registry metadata write (what publish.yml's own `npm
          # publish` waits on) finishes well before the tarball is actually
          # fetchable through npm's CDN-fronted storage, and that lag has
          # run past 5 minutes every time observed so far. 50 x 15s (~12.5
          # min) gives real headroom without an unbounded wait.
          for i in $(seq 1 50); do
            if curl -sfI "$URL" > /dev/null; then
              echo "tarball is live: $URL"
              exit 0
            fi
            echo "not live yet ($i/50), waiting 15s..."
            sleep 15
          done
          echo "::error::npm tarball never became available at $URL — is publish.yml still running or did it fail?"
          exit 1

      - name: Bump mycelium formula in krapie/homebrew-tap
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          # brew bump-formula-pr has no --tap flag (confirmed against its own
          # --help, which only lists a bare [formula] positional arg) — the
          # tap is selected by fully-qualifying the formula name instead,
          # same as `brew install krapie/tap/mycelium`. It does NOT
          # auto-tap, though (confirmed against the real v0.3.2 run:
          # `No available formula with the name "krapie/tap/mycelium".
          # This command requires the tap krapie/tap.`) -- a fresh
          # macos-latest runner has no taps beyond Homebrew's own core/cask,
          # so this has to be explicit.
          brew tap krapie/tap
          brew bump-formula-pr \
            --url "https://registry.npmjs.org/@kevinprk/mycelium/-/mycelium-${VERSION}.tgz" \
            --no-browse \
            krapie/tap/mycelium
