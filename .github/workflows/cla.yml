name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-check:
    runs-on: ubuntu-latest
    # Re-runs on: the PR itself opening/syncing, a "recheck" comment, OR the
    # actual sign-off comment (custom-pr-sign-comment below) — without that
    # last clause, signing does nothing by itself and a contributor has to
    # post a second, separate "recheck" comment just to make it re-check
    # what they just signed.
    if: >
      github.event_name == 'pull_request_target' ||
      (github.event.comment.body &&
        (contains(github.event.comment.body, 'recheck') ||
         contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/${{ github.repository }}/blob/main/CLA.md"
          # Signatures live on a dedicated branch of THIS repo — no external
          # service, no separate storage repo to provision.
          branch: "cla-signatures"
          allowlist: dependabot[bot]
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge this, please sign
            our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            by replying to this PR with the sentence below.
