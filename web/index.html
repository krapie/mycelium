<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mycelium</title>
<style>
  /* Foxfire palette — mycelium glows faint bioluminescent teal in dark humus. */
  :root {
    --bg: #14140f;
    --surface: #1c1b15;
    --surface2: #232219;
    --border: #302e24;
    --text: #e9e4d6;
    --dim: #8b8574;
    --faint: #5e594c;
    --fox: #7fe0c4;    /* bioluminescent accent, used sparingly */
    --spore: #d4a24e;  /* secondary, for codex / warnings */
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 14px; line-height: 1.5; display: flex; flex-direction: column;
  }
  a { color: var(--fox); }

  header {
    display: flex; align-items: baseline; gap: 14px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
  }
  .logo { font-family: var(--mono); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
  .logo b { color: var(--fox); }
  .tagline { color: var(--dim); font-size: 12px; }
  .spacer { flex: 1; }
  .stat { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .stat b { color: var(--text); }

  main { flex: 1; display: grid; grid-template-columns: 240px 1fr 380px; min-height: 0; }
  .pane { overflow-y: auto; min-height: 0; }
  .pane.tree { border-right: 1px solid var(--border); padding: 14px 10px; }
  .pane.list { border-right: 1px solid var(--border); }
  .pane.detail { padding: 18px 20px; }

  .pane-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--faint); padding: 2px 8px 10px;
  }

  /* Folder tree — hyphae threads connect the nodes. */
  .node {
    position: relative; padding: 5px 8px 5px 8px; border-radius: 6px; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; color: var(--dim); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .node:hover { background: var(--surface); color: var(--text); }
  .node.active { background: var(--surface2); color: var(--fox); }
  .node .count { color: var(--faint); margin-left: 6px; }
  .node.depth1 { margin-left: 14px; }
  .node.depth2 { margin-left: 28px; }
  .node.depth3 { margin-left: 42px; }
  .node.child::before {
    content: ""; position: absolute; left: -1px; top: 0; bottom: 50%;
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border);
    width: 10px; border-bottom-left-radius: 4px;
  }

  .searchbar { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; position: sticky; top: 0; background: var(--bg); z-index: 2; }
  input[type=text] {
    flex: 1; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 8px 11px; font-family: var(--sans); font-size: 13px;
  }
  input[type=text]:focus { outline: none; border-color: var(--fox); }
  .tagrow { padding: 8px 14px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: 1px solid var(--border); }
  .chip {
    font-family: var(--mono); font-size: 11px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--dim); cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--fox); color: var(--text); }
  .chip.on { background: var(--fox); border-color: var(--fox); color: #0c1712; }
  .chip .n { opacity: .6; margin-left: 4px; }

  .session {
    padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .session:hover { background: var(--surface); }
  .session.active { background: var(--surface2); box-shadow: inset 2px 0 0 var(--fox); }
  .session .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.claude-code { background: var(--fox); box-shadow: 0 0 6px var(--fox); }
  .dot.codex { background: var(--spore); box-shadow: 0 0 6px var(--spore); }
  .sid { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .human { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: var(--spore); border: 1px solid var(--spore); border-radius: 4px; padding: 0 4px; }
  .session .summary { color: var(--text); font-size: 13px; }
  .session .preview { color: var(--dim); font-size: 12.5px; }
  .session .tags { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-family: var(--mono); font-size: 10.5px; color: var(--fox); opacity: .85; }
  .folderpath { font-family: var(--mono); font-size: 10.5px; color: var(--faint); margin-left: auto; }

  .detail h2 { font-size: 15px; margin: 0 0 2px; }
  .detail .meta { font-family: var(--mono); font-size: 11px; color: var(--dim); margin-bottom: 16px; word-break: break-all; }
  .detail .block { margin-bottom: 16px; }
  .detail .block h3 { font-family: var(--mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); margin: 0 0 6px; }
  .detail .turns { max-height: 40vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .turn { padding: 8px 11px; border-bottom: 1px solid var(--border); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .turn:last-child { border: none; }
  .turn .role { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 2px; }
  .turn.user .role { color: var(--fox); }
  .empty { color: var(--faint); padding: 40px 20px; text-align: center; font-size: 13px; }
  .digest-md { white-space: pre-wrap; font-size: 13px; }
  .viewtoggle { margin-left: auto; display: flex; gap: 4px; }
  .viewtoggle button { font-family: var(--mono); font-size: 11px; background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .viewtoggle button.on { border-color: var(--fox); color: var(--fox); }

  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .pane.tree, .pane.detail { display: none; } }
</style>
</head>
<body>
<header>
  <span class="logo">MY<b>CE</b>LIUM</span>
  <span class="tagline">context lifecycle · capture → organize → learn → reuse</span>
  <span class="spacer"></span>
  <span class="stat"><b id="stat-n">0</b> sessions</span>
  <div class="viewtoggle">
    <button id="tab-sessions" class="on">Sessions</button>
    <button id="tab-digests">Digests</button>
  </div>
</header>
<main>
  <aside class="pane tree" id="tree"><div class="pane-label">Folders</div></aside>
  <section class="pane list" id="listpane">
    <div class="searchbar"><input id="q" type="text" placeholder="세션 검색 (내용·요약 전문검색)" /></div>
    <div class="tagrow" id="tagrow"></div>
    <div id="list"></div>
  </section>
  <aside class="pane detail" id="detail"><div class="empty">세션을 선택하세요</div></aside>
</main>
<script>
const state = { folder: null, tags: new Set(), q: '', sessions: [], active: null, view: 'sessions' };

async function api(path) { const r = await fetch(path); return r.json(); }

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

async function loadTree() {
  const { folders } = await api('/api/folders');
  const counts = {};
  for (const s of state.sessions) { const f = s.folder || '_inbox'; counts[f] = (counts[f]||0)+1; }
  const inbox = state.sessions.filter(s => !s.folder).length;
  const el = document.getElementById('tree');
  el.innerHTML = '<div class="pane-label">Folders</div>';
  const all = document.createElement('div');
  all.className = 'node' + (state.folder===null?' active':'');
  all.innerHTML = '전체 <span class="count">'+state.sessions.length+'</span>';
  all.onclick = () => { state.folder=null; render(); };
  el.appendChild(all);
  if (inbox) {
    const ib = document.createElement('div');
    ib.className = 'node' + (state.folder==='_inbox'?' active':'');
    ib.innerHTML = '_inbox <span class="count">'+inbox+'</span>';
    ib.onclick = () => { state.folder='_inbox'; render(); };
    el.appendChild(ib);
  }
  for (const f of folders) {
    const depth = Math.min(f.split('/').length - 1, 3);
    const node = document.createElement('div');
    node.className = 'node depth'+depth+(depth>0?' child':'')+(state.folder===f?' active':'');
    node.innerHTML = esc(f.split('/').pop()) + ' <span class="count">'+(counts[f]||0)+'</span>';
    node.title = f;
    node.onclick = () => { state.folder=f; render(); };
    el.appendChild(node);
  }
}

async function loadTags() {
  const { tags } = await api('/api/tags');
  const row = document.getElementById('tagrow');
  row.innerHTML = '';
  for (const t of tags.slice(0, 24)) {
    const c = document.createElement('span');
    c.className = 'chip' + (state.tags.has(t.name)?' on':'');
    c.innerHTML = esc(t.name) + '<span class="n">'+t.n+'</span>';
    c.onclick = () => { state.tags.has(t.name)?state.tags.delete(t.name):state.tags.add(t.name); render(); };
    row.appendChild(c);
  }
}

async function loadSessions() {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  if (state.tags.size) p.set('tags', [...state.tags].join(','));
  if (state.folder && state.folder !== '_inbox') p.set('folder', state.folder);
  const { sessions } = await api('/api/sessions?' + p.toString());
  let list = sessions;
  if (state.folder === '_inbox') list = list.filter(s => !s.folder);
  return list;
}

function renderList(list) {
  const el = document.getElementById('list');
  if (!list.length) { el.innerHTML = '<div class="empty">해당하는 세션이 없습니다</div>'; return; }
  el.innerHTML = '';
  for (const s of list) {
    const div = document.createElement('div');
    div.className = 'session' + (state.active===s.id?' active':'');
    const tags = (s.tags||[]).map(t => '<span class="tag">#'+esc(t)+'</span>').join('');
    div.innerHTML =
      '<div class="top"><span class="dot '+s.source+'"></span>'
      + '<span class="sid">'+s.id.slice(0,8)+'</span>'
      + (s.organizedBy==='human'?'<span class="human">사람</span>':'')
      + '<span class="folderpath">'+esc(s.folder||'_inbox')+'</span></div>'
      + '<div class="'+(s.summary?'summary':'preview')+'">'+esc(s.summary || s.preview || '(내용 없음)')+'</div>'
      + (tags?'<div class="tags">'+tags+'</div>':'');
    div.onclick = () => { state.active = s.id; openDetail(s.id); renderList(list); };
    el.appendChild(div);
  }
}

async function openDetail(id) {
  const { session: n } = await api('/api/sessions/' + encodeURIComponent(id));
  const el = document.getElementById('detail');
  if (!n) { el.innerHTML = '<div class="empty">불러올 수 없음</div>'; return; }
  const block = (title, body) => body ? '<div class="block"><h3>'+title+'</h3>'+body+'</div>' : '';
  const listOf = (arr) => (arr&&arr.length) ? '<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>' : '';
  const turns = n.turns.slice(0, 60).map(t =>
    '<div class="turn '+t.role+'"><span class="role">'+t.role+'</span>'+esc(t.text.slice(0,1200))+'</div>').join('');
  el.innerHTML =
    '<h2>'+esc(n.extracted.summary ? n.extracted.summary.slice(0,80) : n.turns.find(t=>t.role==='user')?.text?.slice(0,60) || n.id.slice(0,8))+'</h2>'
    + '<div class="meta">'+n.source+' · '+n.id.slice(0,8)+' · '+(n.startedAt||'').slice(0,16).replace('T',' ')+' · '+esc(n.folder||'_inbox')+'</div>'
    + block('Summary', n.extracted.summary ? '<div>'+esc(n.extracted.summary)+'</div>' : '')
    + block('Decisions', listOf(n.extracted.decisions))
    + block('Todos', listOf(n.extracted.todos))
    + block('Files', listOf((n.artifacts.filesChanged||[]).slice(0,20)))
    + block('Transcript', '<div class="turns">'+turns+'</div>');
}

async function loadDigests() {
  const { digests } = await api('/api/digests');
  const list = document.getElementById('list');
  document.getElementById('tagrow').innerHTML = '';
  if (!digests.length) { list.innerHTML = '<div class="empty">아직 다이제스트가 없습니다</div>'; return; }
  list.innerHTML = '';
  for (const f of digests) {
    const div = document.createElement('div');
    div.className = 'session';
    div.innerHTML = '<div class="top"><span class="dot claude-code"></span><span class="sid">'+esc(f.replace('.md',''))+'</span></div>';
    div.onclick = async () => {
      const { markdown } = await api('/api/digests/' + encodeURIComponent(f));
      document.getElementById('detail').innerHTML = '<div class="digest-md">'+esc(markdown)+'</div>';
    };
    list.appendChild(div);
  }
}

async function render() {
  if (state.view === 'digests') { loadDigests(); return; }
  state.sessions = await api('/api/sessions').then(r=>r.sessions);
  document.getElementById('stat-n').textContent = state.sessions.length;
  await loadTree();
  await loadTags();
  renderList(await loadSessions());
}

let qTimer;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  qTimer = setTimeout(async () => { state.q = e.target.value.trim(); renderList(await loadSessions()); }, 220);
});
document.getElementById('tab-sessions').onclick = () => {
  state.view='sessions'; document.getElementById('tab-sessions').classList.add('on'); document.getElementById('tab-digests').classList.remove('on'); render();
};
document.getElementById('tab-digests').onclick = () => {
  state.view='digests'; document.getElementById('tab-digests').classList.add('on'); document.getElementById('tab-sessions').classList.remove('on'); render();
};
render();
</script>
</body>
</html>
